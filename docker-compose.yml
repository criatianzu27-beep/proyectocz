services:
  # Servicio de la aplicación PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bases_de_datos
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    networks:
      - bbdd_network
    depends_on:
      - db

  # Servicio de base de datos (MariaDB/MySQL)
  db:
    image: mariadb:10.8
    container_name: bbdd_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bbdd_db
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    ports:
      - "3307:3306" # Mapeado al puerto 3307 externo para evitar conflicto
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bbdd_network

  # Servicio de phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: bbdd_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    networks:
      - bbdd_network
    depends_on:
      - db

# --- DEFINICIONES GLOBALES AL FINAL DEL ARCHIVO ---
networks:
  bbdd_network:
    driver: bridge

volumes:
  db_data:
    